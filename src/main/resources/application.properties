spring.profiles.active=prod
spring.datasource.url=jdbc:postgresql://localhost:5432/autopulse
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
server.port=${PORT:8080}

# En producción, JWT_SECRET debe definirse como variable de entorno (ver render.yaml).
# El valor por defecto de aquí abajo es SOLO para desarrollo local.
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production}

